<svg xmlns="http://www.w3.org/2000/svg"
  width="1180" height="610" viewBox="0 0 1180 610"
  role="img"
  aria-label="Sumanth Dusanapudi — AI Engineer profile with terminal visual map, system information, core stack, Royal AI and NewsPulse AI projects">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#F8FAFC;#FFFFFF" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF6FF">
        <animate attributeName="stop-color" values="#EEF6FF;#EAF5FF;#EEF6FF" dur="16s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#10B981"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.18 0;0.18 0;-0.18 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="orb1" cx="20%" cy="15%" r="75%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="85%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#10B981" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#DCE7F3" stroke-width=".7" opacity=".55"/>
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#94A3B8" flood-opacity=".18"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="leftClip"><rect x="32" y="74" width="420" height="500" rx="22"/></clipPath>
    <clipPath id="photoClip"><rect x="136" y="160" width="212" height="260" rx="22"/></clipPath>

    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
      .sans{font-family:Inter,Arial,Helvetica,sans-serif}
      .terminal{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#64748B}
      .eyebrow{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2.2px;fill:#0891B2}
      .name{font:800 34px Inter,Arial,Helvetica,sans-serif;fill:#0F172A}
      .headline{font:600 16px Inter,Arial,Helvetica,sans-serif;fill:#64748B}
      .ascii{font:600 9.6px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:url(#accentGrad);white-space:pre}
      .leftRole{font:800 18px Inter,Arial,Helvetica,sans-serif;fill:#0F172A;letter-spacing:1.1px}
      .prompt{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#10B981}
      .section{font:800 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2.4px;fill:#0891B2}
      .label{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.4px;fill:#64748B;text-anchor:end}
      .value{font:600 15px Inter,Arial,Helvetica,sans-serif;fill:#0F172A}
      .pill{fill:#F1F7FD;stroke:#CBD5E1;stroke-width:1}
      .pillText{font:600 12px Inter,Arial,Helvetica,sans-serif;fill:#0F172A}
      .link{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0891B2}
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="610" rx="26" fill="url(#bg)"/>
  <rect x="0" y="0" width="1180" height="610" rx="26" fill="url(#grid)" opacity=".62"/>
  <rect x="0" y="0" width="1180" height="610" rx="26" fill="url(#orb1)"/>
  <rect x="0" y="0" width="1180" height="610" rx="26" fill="url(#orb2)"/>
  <rect x="1.5" y="1.5" width="1177" height="607" rx="24.5" fill="none" stroke="#CBD5E1" stroke-width="2"/>

  <!-- terminal chrome -->
  <rect x="0" y="0" width="1180" height="48" rx="26" fill="#F7FBFF" fill-opacity=".92"/>
  <rect x="0" y="24" width="1180" height="24" fill="#F7FBFF" fill-opacity=".92"/>
  <circle cx="28" cy="24" r="6" fill="#FF5F57"/>
  <circle cx="50" cy="24" r="6" fill="#FEBC2E"/>
  <circle cx="72" cy="24" r="6" fill="#28C840"/>
  <text x="100" y="29" class="terminal">sumanth@developer:~</text>
  <g transform="translate(1016,13)">
    <rect width="132" height="24" rx="12" fill="#10B981" fill-opacity=".10" stroke="#10B981" stroke-opacity=".55"/>
    <circle cx="17" cy="12" r="4" fill="#10B981">
      <animate attributeName="opacity" values=".5;1;.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="17" class="terminal" fill="#10B981">ONLINE</text>
  </g>

  <!-- panels -->
  <rect x="32" y="74" width="420" height="500" rx="22" fill="#FFFFFF" fill-opacity=".82" stroke="#CBD5E1" filter="url(#shadow)"/>
  <rect x="474" y="74" width="674" height="500" rx="22" fill="#FFFFFF" fill-opacity=".82" stroke="#CBD5E1" filter="url(#shadow)"/>

  <!-- left -->
  <text x="58" y="108" class="section">VISUAL.MAP</text>
  <text x="58" y="130" class="terminal">[ profile / engineering ]</text>

  <g clip-path="url(#leftClip)">
    <rect x="128" y="152" width="228" height="276" rx="26" fill="none" stroke="url(#accentGrad)" stroke-width="2.2" opacity=".95"/>
    <image href="https://avatars.githubusercontent.com/u/319428566?v=4" x="136" y="160" width="212" height="260" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)" opacity="1">
      <animate attributeName="opacity" values="0;1" dur=".45s" begin=".20s" fill="freeze"/>
    </image>
    <rect x="136" y="160" width="212" height="2" fill="#0891B2" opacity=".16">
      <animate attributeName="y" values="162;418;162" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".08;.30;.08" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".5s" begin=".95s" fill="freeze"/>
    <text x="242" y="476" text-anchor="middle" class="leftRole">AI ENGINEER</text>
    <text x="242" y="480" text-anchor="middle" class="headline">Generative AI · RAG · Full-Stack AI</text>
    <text x="58" y="532" class="prompt">~/profile $ build --ship</text>
    <rect x="232" y="518" width="9" height="18" rx="1" fill="#10B981">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- right -->
  <text x="510" y="108" class="section">SYSTEM.INFO</text>
  <text x="510" y="132" class="terminal">sumanth@developer:~$ ./profile.sh</text>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".45s" begin=".25s" fill="freeze"/>
    <text x="510" y="172" class="name">Sumanth Dusanapudi</text>
    <text x="510" y="196" class="headline">AI Engineer · Generative AI · RAG Builder</text>
  </g>

  
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".35s" begin="0.70s" fill="freeze"/>
        <text x="620" y="214" class="label">NAME</text>
        <text x="646" y="214" class="value">Sumanth Dusanapudi</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".35s" begin="0.83s" fill="freeze"/>
        <text x="620" y="250" class="label">ROLE</text>
        <text x="646" y="250" class="value">AI Engineer</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".35s" begin="0.96s" fill="freeze"/>
        <text x="620" y="286" class="label">FOCUS</text>
        <text x="646" y="286" class="value">Generative AI · LLMs · RAG</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".35s" begin="1.09s" fill="freeze"/>
        <text x="620" y="322" class="label">BACKEND</text>
        <text x="646" y="322" class="value">Python · FastAPI · Node.js · Express</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".35s" begin="1.22s" fill="freeze"/>
        <text x="620" y="358" class="label">FRONTEND</text>
        <text x="646" y="358" class="value">React · JavaScript</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".35s" begin="1.35s" fill="freeze"/>
        <text x="620" y="394" class="label">AI STACK</text>
        <text x="646" y="394" class="value">LangChain · Claude · MCP</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".35s" begin="1.48s" fill="freeze"/>
        <text x="620" y="430" class="label">BUILDING</text>
        <text x="646" y="430" class="value">Royal AI · NewsPulse AI</text>
      </g>

  <text x="510" y="462" class="section">CORE.STACK</text>
  
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="1.65s" fill="freeze"/>
      <rect x="520" y="476" width="96" height="30" rx="15" class="pill"/>
      <circle cx="536" cy="491" r="4" fill="#10B981"/>
      <text x="548" y="496" class="pillText">Python</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="1.73s" fill="freeze"/>
      <rect x="624" y="476" width="104" height="30" rx="15" class="pill"/>
      <circle cx="640" cy="491" r="4" fill="#0891B2"/>
      <text x="652" y="496" class="pillText">FastAPI</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="1.81s" fill="freeze"/>
      <rect x="736" y="476" width="86" height="30" rx="15" class="pill"/>
      <circle cx="752" cy="491" r="4" fill="#10B981"/>
      <text x="764" y="496" class="pillText">React</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="1.89s" fill="freeze"/>
      <rect x="830" y="476" width="120" height="30" rx="15" class="pill"/>
      <circle cx="846" cy="491" r="4" fill="#0891B2"/>
      <text x="858" y="496" class="pillText">LangChain</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="1.97s" fill="freeze"/>
      <rect x="958" y="476" width="74" height="30" rx="15" class="pill"/>
      <circle cx="974" cy="491" r="4" fill="#10B981"/>
      <text x="986" y="496" class="pillText">RAG</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="2.05s" fill="freeze"/>
      <rect x="1040" y="476" width="70" height="30" rx="15" class="pill"/>
      <circle cx="1056" cy="491" r="4" fill="#0891B2"/>
      <text x="1068" y="496" class="pillText">MCP</text>
    </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".35s" begin="2.15s" fill="freeze"/>
    <line x1="510" y1="526" x2="1112" y2="526" stroke="#CBD5E1" stroke-width="1"/>
    <text x="510" y="552" class="link">github.com/Sumanthduasanapudi</text>
    <text x="1112" y="552" text-anchor="end" class="terminal">Royal AI · NewsPulse AI</text>
  </g>

  <!-- subtle particles -->
  <circle cx="460" cy="102" r="2.2" fill="#0891B2" opacity=".55">
    <animateTransform attributeName="transform" type="translate" values="0 0;6 12;0 0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="92" r="2.6" fill="#10B981" opacity=".5">
    <animateTransform attributeName="transform" type="translate" values="0 0;-8 16;0 0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1088" cy="558" r="2.1" fill="#2563EB" opacity=".45">
    <animate attributeName="opacity" values=".2;.7;.2" dur="4.2s" repeatCount="indefinite"/>
  </circle>
</svg>