      <text x="108" y="482">01010011 01010101 01001101 01000001 01001110 01010100 01001000</text>
      <text x="108" y="500">build_real_projects(); explain_clearly(); grow_daily();</text>
      <text x="108" y="518">AI // LLM // RAG // API // FULL STACK // AGENTS // MCP</text>
      <text x="108" y="536">github.com/Sumanthduasanapudi</text>
    </g>
    <rect class="scan" x="95" y="120" width="350" height="3" fill="#5eead4" opacity=".45" filter="url(#glow)"/>
  </g>

  <!-- glasses / face line art -->
