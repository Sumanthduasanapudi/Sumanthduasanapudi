  <rect x="0" y="28" width="1200" height="30" fill="#07121d"/>
  <circle cx="28" cy="29" r="7" fill="#ff5f57"/>
  <circle cx="52" cy="29" r="7" fill="#febc2e"/>
  <circle cx="76" cy="29" r="7" fill="#28c840"/>
