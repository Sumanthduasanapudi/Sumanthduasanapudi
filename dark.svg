      <text x="108" y="302">python node react api rag embeddings agents orchestration</text>
      <text x="108" y="320">01100001 01101001 00100000 01100101 01101110 01100111</text>
      <text x="108" y="338">def learn(): return build() + debug() + improve()</text>
      <text x="108" y="356">status = "shipping AI projects"</text>
