<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071017"/>
      <stop offset="55%" stop-color="#08151f"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="55%" stop-color="#35c8ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="portrait">
      <path d="M215 156
               C190 170 176 197 174 226
               C172 245 179 267 190 282
               C199 295 206 306 206 321
               C206 336 197 348 186 354
               C150 370 126 394 115 430
               C101 478 99 517 105 545
               L420 545
               C426 507 424 471 415 438
               C405 398 378 370 341 354
               C328 348 319 336 319 321
               C319 306 327 293 338 278
               C350 260 356 238 353 218
               C350 183 333 158 306 146
               C284 137 237 140 215 156 Z"/>
    </clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .small{font-size:14px}
      .mid{font-size:18px}
      .label{fill:#5eead4;font-weight:700}
      .value{fill:#dbeafe}
      .muted{fill:#7f98ad}
      .cursor{animation:blink 1s steps(1) infinite}
      .scan{animation:scan 5s linear infinite}
      .pulse{animation:pulse 2.8s ease-in-out infinite}
      @keyframes blink{50%{opacity:0}}
      @keyframes scan{0%{transform:translateY(-80px)}100%{transform:translateY(470px)}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
    </style>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="617" rx="26.5" fill="none" stroke="#183248" stroke-width="3"/>

  <!-- terminal top bar -->
