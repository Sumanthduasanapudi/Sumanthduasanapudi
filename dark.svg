      <rect x="830" y="470" width="120" height="30" rx="15" class="pill"/>
      <circle cx="846" cy="485" r="4" fill="#22D3EE"/>
      <text x="858" y="490" class="pillText">LangChain</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="1.97s" fill="freeze"/>
      <rect x="958" y="470" width="74" height="30" rx="15" class="pill"/>
      <circle cx="974" cy="485" r="4" fill="#10B981"/>
      <text x="986" y="490" class="pillText">RAG</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="2.05s" fill="freeze"/>
      <rect x="1040" y="470" width="70" height="30" rx="15" class="pill"/>
      <circle cx="1056" cy="485" r="4" fill="#22D3EE"/>
      <text x="1068" y="490" class="pillText">MCP</text>
