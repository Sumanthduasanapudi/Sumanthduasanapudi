  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".35s" begin="2.15s" fill="freeze"/>
    <line x1="510" y1="521" x2="1112" y2="521" stroke="#24324A" stroke-width="1"/>
    <text x="510" y="548" class="link">github.com/Sumanthduasanapudi</text>
    <text x="1112" y="548" text-anchor="end" class="terminal">Royal AI · NewsPulse AI</text>
  </g>

  <!-- subtle particles -->
  <circle cx="460" cy="102" r="2.2" fill="#22D3EE" opacity=".55">
    <animateTransform attributeName="transform" type="translate" values="0 0;6 12;0 0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="92" r="2.6" fill="#10B981" opacity=".5">
    <animateTransform attributeName="transform" type="translate" values="0 0;-8 16;0 0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1088" cy="558" r="2.1" fill="#7C3AED" opacity=".45">
