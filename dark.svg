<svg xmlns="http://www.w3.org/2000/svg"
  width="1180" height="610" viewBox="0 0 1180 610"
  role="img"
  aria-label="Sumanth Dusanapudi — AI Engineer profile with terminal visual map, system information, core stack, Royal AI and NewsPulse AI projects">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712">
        <animate attributeName="stop-color" values="#030712;#07111F;#030712" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#0B1220">
        <animate attributeName="stop-color" values="#0B1220;#0D1630;#0B1220" dur="16s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.18 0;0.18 0;-0.18 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="orb1" cx="20%" cy="15%" r="75%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="85%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#10B981" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#152033" stroke-width=".7" opacity=".32"/>
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity=".38"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="leftClip"><rect x="32" y="74" width="420" height="500" rx="22"/></clipPath>

    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
      .sans{font-family:Inter,Arial,Helvetica,sans-serif}
      .terminal{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#94A3B8}
      .eyebrow{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2.2px;fill:#22D3EE}
      .name{font:800 34px Inter,Arial,Helvetica,sans-serif;fill:#F8FAFC}
      .headline{font:600 16px Inter,Arial,Helvetica,sans-serif;fill:#94A3B8}
      .ascii{font:600 9.6px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:url(#accentGrad);white-space:pre}
      .leftRole{font:800 18px Inter,Arial,Helvetica,sans-serif;fill:#F8FAFC;letter-spacing:1.1px}
      .prompt{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#10B981}
      .section{font:800 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2.4px;fill:#22D3EE}
      .label{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.4px;fill:#94A3B8;text-anchor:end}
      .value{font:600 15px Inter,Arial,Helvetica,sans-serif;fill:#F8FAFC}
      .pill{fill:#101B30;stroke:#24324A;stroke-width:1}
      .pillText{font:600 12px Inter,Arial,Helvetica,sans-serif;fill:#F8FAFC}
      .link{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#22D3EE}
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="610" rx="26" fill="url(#bg)"/>
  <rect x="0" y="0" width="1180" height="610" rx="26" fill="url(#grid)" opacity=".55"/>
  <rect x="0" y="0" width="1180" height="610" rx="26" fill="url(#orb1)"/>
  <rect x="0" y="0" width="1180" height="610" rx="26" fill="url(#orb2)"/>
  <rect x="1.5" y="1.5" width="1177" height="607" rx="24.5" fill="none" stroke="#24324A" stroke-width="2"/>

  <!-- terminal chrome -->
  <rect x="0" y="0" width="1180" height="48" rx="26" fill="#0B1324" fill-opacity=".78"/>
  <rect x="0" y="24" width="1180" height="24" fill="#0B1324" fill-opacity=".78"/>
  <circle cx="28" cy="24" r="6" fill="#FF5F57"/>
  <circle cx="50" cy="24" r="6" fill="#FEBC2E"/>
  <circle cx="72" cy="24" r="6" fill="#28C840"/>
  <text x="100" y="29" class="terminal">sumanth@developer:~</text>
  <g transform="translate(1016,13)">
    <rect width="132" height="24" rx="12" fill="#10B981" fill-opacity=".12" stroke="#10B981" stroke-opacity=".55"/>
    <circle cx="17" cy="12" r="4" fill="#10B981">
      <animate attributeName="opacity" values=".5;1;.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="17" class="terminal" fill="#10B981">ONLINE</text>
  </g>

  <!-- panels -->
  <rect x="32" y="74" width="420" height="500" rx="22" fill="#0F172A" fill-opacity=".56" stroke="#24324A" filter="url(#shadow)"/>
  <rect x="474" y="74" width="674" height="500" rx="22" fill="#0F172A" fill-opacity=".56" stroke="#24324A" filter="url(#shadow)"/>

  <!-- left -->
  <text x="58" y="108" class="section">VISUAL.MAP</text>
  <text x="58" y="130" class="terminal">[ profile / engineering ]</text>

  <g clip-path="url(#leftClip)">
    <text x="84" y="160.0" class="ascii" opacity="0">                 .:+*##*+:.                 <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.00s" fill="freeze"/></text>
<text x="84" y="172.4" class="ascii" opacity="0">             .+%@@@@@@@@@@%+.               <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.04s" fill="freeze"/></text>
<text x="84" y="184.8" class="ascii" opacity="0">           .*@@@@%#****#%@@@@*.             <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.07s" fill="freeze"/></text>
<text x="84" y="197.2" class="ascii" opacity="0">          +@@@%*:.      .:*%@@@+            <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.11s" fill="freeze"/></text>
<text x="84" y="209.6" class="ascii" opacity="0">         #@@@+.   .::::.   .+@@@#           <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.14s" fill="freeze"/></text>
<text x="84" y="222.0" class="ascii" opacity="0">        +@@#.   .+######+.   .#@@+          <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.18s" fill="freeze"/></text>
<text x="84" y="234.4" class="ascii" opacity="0">        %@@:   :##*++++*##:   :@@%          <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.21s" fill="freeze"/></text>
<text x="84" y="246.8" class="ascii" opacity="0">       .@@#   +#*:      :*#+   #@@.         <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.25s" fill="freeze"/></text>
<text x="84" y="259.2" class="ascii" opacity="0">       :@@*  .##.  .::.  .##.  *@@:         <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.28s" fill="freeze"/></text>
<text x="84" y="271.6" class="ascii" opacity="0">       :@@+  :##.  +**+  .##:  +@@:         <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.32s" fill="freeze"/></text>
<text x="84" y="284.0" class="ascii" opacity="0">       .@@#   *#*.      .*#*   #@@.         <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.35s" fill="freeze"/></text>
<text x="84" y="296.4" class="ascii" opacity="0">        %@@:   *##+....+##*   :@@%          <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.39s" fill="freeze"/></text>
<text x="84" y="308.8" class="ascii" opacity="0">        +@@#.   :*######*:   .#@@+          <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.42s" fill="freeze"/></text>
<text x="84" y="321.2" class="ascii" opacity="0">         #@@@+.   .::::.   .+@@@#           <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.46s" fill="freeze"/></text>
<text x="84" y="333.6" class="ascii" opacity="0">          +@@@%*:.      .:*%@@@+            <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.49s" fill="freeze"/></text>
<text x="84" y="346.0" class="ascii" opacity="0">           .*@@@@%#****#%@@@@*.             <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.53s" fill="freeze"/></text>
<text x="84" y="358.4" class="ascii" opacity="0">             .+%@@@@@@@@@@%+.               <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.56s" fill="freeze"/></text>
<text x="84" y="370.8" class="ascii" opacity="0">               .:+*####*+:.                 <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.60s" fill="freeze"/></text>
<text x="84" y="383.2" class="ascii" opacity="0">              .:+*######*+:.                <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.63s" fill="freeze"/></text>
<text x="84" y="395.6" class="ascii" opacity="0">           .+%@@@@@@@@@@@@@@%+.             <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.67s" fill="freeze"/></text>
<text x="84" y="408.0" class="ascii" opacity="0">        .+%@@@@@@@@@@@@@@@@@@@@%+.          <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.70s" fill="freeze"/></text>
<text x="84" y="420.4" class="ascii" opacity="0">      .*@@@@@@@@@@@@@@@@@@@@@@@@@@*.        <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.74s" fill="freeze"/></text>
<text x="84" y="432.8" class="ascii" opacity="0">     +@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@+       <animate attributeName="opacity" values="0;1" dur=".24s" begin="0.77s" fill="freeze"/></text>

    <rect x="52" y="126" width="374" height="2" fill="#22D3EE" opacity=".18">
      <animate attributeName="y" values="126;438;126" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".08;.35;.08" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".5s" begin=".95s" fill="freeze"/>
    <text x="242" y="470" text-anchor="middle" class="leftRole">AI ENGINEER</text>
    <text x="242" y="494" text-anchor="middle" class="headline">Generative AI · RAG · Full-Stack AI</text>
    <text x="58" y="535" class="prompt">~/profile $ build --ship</text>
    <rect x="232" y="521" width="9" height="18" rx="1" fill="#10B981">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- right -->
  <text x="510" y="108" class="section">SYSTEM.INFO</text>
  <text x="510" y="132" class="terminal">sumanth@developer:~$ ./profile.sh</text>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".45s" begin=".25s" fill="freeze"/>
    <text x="510" y="172" class="name">Sumanth Dusanapudi</text>
    <text x="510" y="196" class="headline">AI Engineer · Generative AI · RAG Builder</text>
  </g>

  
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".35s" begin="0.70s" fill="freeze"/>
        <text x="520" y="212" class="label">NAME</text>
        <text x="662" y="212" class="value">Sumanth Dusanapudi</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".35s" begin="0.83s" fill="freeze"/>
        <text x="520" y="253" class="label">ROLE</text>
        <text x="662" y="253" class="value">AI Engineer</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".35s" begin="0.96s" fill="freeze"/>
        <text x="520" y="294" class="label">FOCUS</text>
        <text x="662" y="294" class="value">Generative AI · LLMs · RAG</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".35s" begin="1.09s" fill="freeze"/>
        <text x="520" y="335" class="label">BACKEND</text>
        <text x="662" y="335" class="value">Python · FastAPI · Node.js · Express</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".35s" begin="1.22s" fill="freeze"/>
        <text x="520" y="376" class="label">FRONTEND</text>
        <text x="662" y="376" class="value">React · JavaScript</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".35s" begin="1.35s" fill="freeze"/>
        <text x="520" y="417" class="label">AI STACK</text>
        <text x="662" y="417" class="value">LangChain · Claude · MCP</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".35s" begin="1.48s" fill="freeze"/>
        <text x="520" y="458" class="label">BUILDING</text>
        <text x="662" y="458" class="value">Royal AI · NewsPulse AI</text>
      </g>

  <text x="510" y="444" class="section">CORE.STACK</text>
  
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="1.65s" fill="freeze"/>
      <rect x="520" y="470" width="96" height="30" rx="15" class="pill"/>
      <circle cx="536" cy="485" r="4" fill="#10B981"/>
      <text x="548" y="490" class="pillText">Python</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="1.73s" fill="freeze"/>
      <rect x="624" y="470" width="104" height="30" rx="15" class="pill"/>
      <circle cx="640" cy="485" r="4" fill="#22D3EE"/>
