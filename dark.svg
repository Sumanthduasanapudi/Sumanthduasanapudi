    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="1.81s" fill="freeze"/>
      <rect x="736" y="470" width="86" height="30" rx="15" class="pill"/>
      <circle cx="752" cy="485" r="4" fill="#10B981"/>
